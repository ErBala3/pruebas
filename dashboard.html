<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRAccess – Fichaje</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d; --surface: #161616; --surface2: #1e1e1e; --border: #2a2a2a;
  --border2: #333333; --accent: #e2e2e2; --text: #f0f0f0;
  --text-secondary: #a0a0a0; --muted: #666666;
  --danger: #c0392b; --success: #2d7a4f; --warn: #8a6800;
}
body {
  font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 76px 0 40px;
}
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between; padding: 0 24px; z-index: 10;
}
.logo { font-size: 18px; font-weight: 700; color: var(--text); }
.logo span { color: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-secondary); }
.btn-logout { padding: 6px 14px; background: transparent; color: var(--danger); border: 1px solid rgba(192,57,43,.4); border-radius: 7px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .2s; }
.btn-logout:hover { background: rgba(192,57,43,.08); border-color: var(--danger); }
.page-layout {
  display: flex; gap: 20px; padding: 0 20px; max-width: 1100px; margin: 0 auto; align-items: flex-start;
}
.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; max-width: 480px; }
.cal-sidebar {
  width: 300px; flex-shrink: 0; position: sticky; top: 76px;
  max-height: calc(100vh - 96px); overflow-y: auto; padding-bottom: 20px;
}
.cal-sidebar::-webkit-scrollbar { width: 4px; }
.cal-sidebar::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
/* ── Responsive – desktop medio ── */
@media (max-width: 820px) {
  .page-layout  { flex-direction: column; padding: 0 16px; }
  .cal-sidebar  { width: 100%; position: static; max-height: none; }
  .main-wrap    { max-width: 100%; }
}
/* ── Responsive – móvil ── */
@media (max-width: 600px) {
  .topbar       { padding: 0 16px; height: 52px; }
  .logo         { font-size: 16px; }
  body          { padding-top: 68px; }
  .page-layout  { padding: 0 12px; gap: 14px; }
  .horas-grid   { grid-template-columns: 1fr 1fr; }
  .card         { padding: 20px 16px 18px; }
  .cal-dia .dia-num { font-size: 9px; }
  .cal-dia .dia-h   { display: none; }
  .mes-header   { padding: 9px 12px; }
  .mes-nombre   { font-size: 12px; }
  .mes-resumen  { font-size: 10px; }
}
/* ── Responsive – móvil pequeño ── */
@media (max-width: 380px) {
  .topbar-right { gap: 8px; font-size: 12px; }
  .btn-logout   { padding: 5px 10px; font-size: 12px; }
  .horas-grid   { grid-template-columns: 1fr 1fr; gap: 6px; }
  .hstat-value  { font-size: 14px; }
  .cal-grid     { gap: 2px; }
  .cal-dia      { border-radius: 3px; }
}

/* ── Panel horas ── */
.horas-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 20px 22px; animation: fadeUp .4s ease both;
}
.horas-panel-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 14px; }
.horas-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.hstat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.hstat-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; margin-bottom: 4px; }
.hstat-value { font-size: 16px; font-weight: 700; color: var(--text); }
.hstat-value.c-ok   { color: #6ab88a; }
.hstat-value.c-warn { color: #b8960a; }
.hstat-value.c-err  { color: #c0392b; }
.progress-wrap { margin-bottom: 12px; }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
.progress-bar { height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .7s ease; background: #2d7a4f; }
.progress-fill.p-warn { background: #8a6800; }
.progress-fill.p-over { background: #c0392b; }
.balance-msg { padding: 10px 14px; border-radius: 7px; font-size: 12px; line-height: 1.6; border-left: 3px solid; }
.balance-msg.s-ok   { background: rgba(45,122,79,.08);   border-color: #2d7a4f; color: #6ab88a; }
.balance-msg.s-warn { background: rgba(138,104,0,.08);   border-color: #8a6800; color: #b8960a; }
.balance-msg.s-err  { background: rgba(192,57,43,.08);   border-color: #c0392b; color: #c0392b; }
.balance-msg.s-info { background: rgba(226,226,226,.04); border-color: #444;   color: var(--text-secondary); }
.year-summary { margin-top: 16px; padding: 14px 16px; background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 10px; }
.year-summary-title { font-size: 10px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 10px; }
.year-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.year-summary-item { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-radius: 8px; padding: 10px 12px; }
.year-summary-item .label { font-size: 10px; color: var(--text-secondary); margin-bottom: 4px; }
.year-summary-item .value { font-size: 14px; font-weight: 700; color: var(--text); }
.bm-title { font-weight: 600; margin-bottom: 2px; font-size: 12px; }

/* ── Card escáner ── */
.card {
  width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 28px 24px 24px; box-shadow: 0 8px 32px rgba(0,0,0,.4);
  animation: fadeUp .5s .1s ease both;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.card-sub   { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
#reader { width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
.status-box { margin-top: 16px; padding: 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; display: none; }
.status-box.ok   { display: block; background: rgba(45,122,79,.08);  border: 1px solid rgba(45,122,79,.2);  color: #6ab88a; }
.status-box.err  { display: block; background: rgba(192,57,43,.08);  border: 1px solid rgba(192,57,43,.2);  color: #c0392b; }
.status-box.warn { display: block; background: rgba(138,104,0,.08);  border: 1px solid rgba(138,104,0,.2);  color: #b8960a; }
.fichaje-hora   { font-size: 22px; font-weight: 700; color: var(--accent); margin-top: 6px; letter-spacing: 1px; }
.fichaje-fecha  { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.fichaje-detail { font-size: 12px; color: var(--text-secondary); margin-top: 6px; line-height: 1.7; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--text-secondary); border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.auto-msg { padding: 26px 16px; text-align: center; font-size: 13px; color: var(--text-secondary); }
.btn-rescan { width: 100%; margin-top: 12px; padding: 11px; background: transparent; color: #a0a0a0; border: 1px solid #2a2a2a; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; display: none; }
.btn-rescan:hover { background: rgba(255,255,255,.04); border-color: #555; }
.btn-rescan.show { display: block; }

/* ── Calendario anual ── */
.cal-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 18px;
}
.cal-panel-title {
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px;
}
/* Mes acordeón */
.mes-item { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
.mes-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; cursor: pointer; user-select: none;
  transition: background .15s;
}
.mes-header:hover { background: rgba(255,255,255,.03); }
.mes-nombre { font-size: 13px; font-weight: 600; }
.mes-nombre.c-ok   { color: #6ab88a; }
.mes-nombre.c-err  { color: #c0392b; }
.mes-nombre.c-none { color: var(--text-secondary); }
.mes-resumen { font-size: 11px; color: var(--muted); }
.mes-arrow { font-size: 10px; color: var(--muted); transition: transform .2s; }
.mes-arrow.open { transform: rotate(180deg); }
/* Cuerpo del mes (calendario) */
.mes-body { display: none; padding: 10px 12px 12px; background: var(--surface2); border-top: 1px solid var(--border); }
.mes-body.open { display: block; }
/* Cabecera días semana */
.cal-week-header {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 3px; margin-bottom: 4px;
}
.cal-wd { font-size: 9px; font-weight: 600; color: var(--muted); text-align: center; padding: 2px 0; }
/* Grid días */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cal-dia {
  aspect-ratio: 1; border-radius: 5px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; font-size: 10px; font-weight: 600;
  border: 1px solid transparent; position: relative;
}
.cal-dia.vacio { background: transparent; border-color: transparent; }
.cal-dia.sin-datos { background: rgba(255,255,255,.03); border-color: var(--border); color: var(--muted); }
.cal-dia.ok   { background: rgba(45,122,79,.18);  border-color: rgba(45,122,79,.4);  color: #6ab88a; }
.cal-dia.err  { background: rgba(192,57,43,.18);  border-color: rgba(192,57,43,.4);  color: #c0392b; }
.cal-dia.hoy  { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal-dia .dia-num { font-size: 11px; line-height: 1; }
.cal-dia .dia-h   { font-size: 8px; color: inherit; opacity: .8; margin-top: 1px; }
/* Futuro */
.cal-dia.futuro { opacity: .25; pointer-events: none; }
</style>
</head>

<script>
// ── Auth guard ────────────────────────────────────────────────────────────
const userRaw = localStorage.getItem('user');
if (!userRaw) location.href = 'index.html';
const user = JSON.parse(userRaw);
if (user.rol === 'admin' || user.rol === 'jefe') location.href = 'admin.html';
document.getElementById('userLabel').textContent = user.nombre || user.email;

// ── Firebase ──────────────────────────────────────────────────────────────
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey: "AIzaSyDKM2Tp1sosbdAeB6qK8P73cShQ0WP76S4",
    authDomain: "basededatos-dd6b3.firebaseapp.com",
    projectId: "basededatos-dd6b3",
    storageBucket: "basededatos-dd6b3.firebasestorage.app",
    messagingSenderId: "452860965959",
    appId: "1:452860965959:web:42ecb1c31f17e55daa6d62"
  });
}
const db = firebase.firestore();

document.getElementById('btnLogout').addEventListener('click', function() {
  localStorage.removeItem('user'); location.href = 'index.html';
});

// ── Constantes ────────────────────────────────────────────────────────────
const MAX_DISTANCIA_METROS  = 200;
const HORAS_JORNADA_NORMAL  = 8;
const HORAS_ANUALES_CONVENIO = 1792; // Convenio colectivo general España

// ── Días laborables (lunes-viernes) ──────────────────────────────────────
function diasLaborablesHastaHoy(anio) {
  const hoy    = new Date();
  const inicio = new Date(anio, 0, 1);
  let dias = 0;
  const c = new Date(inicio);
  const limite = new Date(Math.min(hoy.getTime(), new Date(anio, 11, 31).getTime()));
  while (c <= limite) {
    const dow = c.getDay();
    if (dow !== 0 && dow !== 6) dias++;
    c.setDate(c.getDate() + 1);
  }
  return dias;
}

function diasLaborablesAnio(anio) {
  const inicio = new Date(anio, 0, 1);
  const fin    = new Date(anio, 11, 31);
  let dias = 0;
  const c = new Date(inicio);
  while (c <= fin) {
    const dow = c.getDay();
    if (dow !== 0 && dow !== 6) dias++;
    c.setDate(c.getDate() + 1);
  }
  return dias;
}

// ─────────────────────────────────────────────────────────────────────────
// CALENDARIO ANUAL
// ─────────────────────────────────────────────────────────────────────────
var NOMBRES_MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                     'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var DIAS_SEMANA   = ['L','M','X','J','V','S','D'];

// Horas mínimas por día laboral (convenio / días laborables del mes)
function horasMinDia(anio, mes) {
  // dias laborables en ese mes
  var diasLab = 0;
  var totalDias = new Date(anio, mes + 1, 0).getDate();
  for (var d = 1; d <= totalDias; d++) {
    var dow = new Date(anio, mes, d).getDay();
    if (dow !== 0 && dow !== 6) diasLab++;
  }
  var horasLab = diasLaborablesAnio(anio);
  return diasLab > 0 ? (HORAS_ANUALES_CONVENIO / horasLab) : 0;
}

async function buildCalendario() {
  var anio   = new Date().getFullYear();
  var hoy    = new Date();
  document.getElementById('calAnio').textContent = anio;

  // Traer todos los fichajes del año
  var snap = await db.collection('fichajes').where('userId','==', user.id).get();

  // Agrupar horas trabajadas por fecha 'YYYY-MM-DD'
  // Solo contamos salidas (que tienen horasNormales + horasExtra)
  var horasPorDia = {};
  snap.docs.forEach(function(d) {
    var f  = d.data();
    var ts = f.timestamp && f.timestamp.toDate ? f.timestamp.toDate()
           : (f.timestampCliente ? new Date(f.timestampCliente) : null);
    if (!ts) return;
    if (ts.getFullYear() !== anio) return;
    if (f.tipo !== 'salida') return;
    var key = ts.getFullYear() + '-'
      + String(ts.getMonth()+1).padStart(2,'0') + '-'
      + String(ts.getDate()).padStart(2,'0');
    horasPorDia[key] = (horasPorDia[key] || 0) + (f.horasNormales||0) + (f.horasExtra||0);
  });

  // Calcular horas trabajadas por mes para el color del acordeón
  var horasPorMes = {};
  Object.keys(horasPorDia).forEach(function(key) {
    var mes = parseInt(key.split('-')[1]) - 1; // 0-based
    horasPorMes[mes] = (horasPorMes[mes] || 0) + horasPorDia[key];
  });

  var container = document.getElementById('calMeses');
  container.innerHTML = '';

  for (var m = 0; m < 12; m++) {
    var mesPasado    = new Date(anio, m + 1, 0) < hoy; // mes completamente pasado
    var mesActual    = (m === hoy.getMonth());
    var mesFuturo    = (new Date(anio, m, 1) > hoy);

    // Horas teóricas del mes completo (solo hasta hoy si es mes actual)
    var totalDiasMes = new Date(anio, m + 1, 0).getDate();
    var diasLabMes   = 0;
    var diasHastaHoy = mesPasado ? totalDiasMes : (mesActual ? hoy.getDate() : 0);
    for (var dd = 1; dd <= diasHastaHoy; dd++) {
      var dow = new Date(anio, m, dd).getDay();
      if (dow !== 0 && dow !== 6) diasLabMes++;
    }
    var hTeoricas  = diasLabMes * (HORAS_ANUALES_CONVENIO / diasLaborablesAnio(anio));
    var hTrabajadas = horasPorMes[m] || 0;

    // Color del mes
    var clsMes, txtResumen;
    if (mesFuturo) {
      clsMes     = 'c-none';
      txtResumen = '';
    } else if (hTrabajadas === 0) {
      clsMes     = 'c-none';
      txtResumen = 'Sin registros';
    } else if (hTrabajadas >= hTeoricas - 0.5) {
      clsMes     = 'c-ok';
      txtResumen = hhmm(hTrabajadas) + ' / ' + hhmm(hTeoricas);
    } else {
      clsMes     = 'c-err';
      txtResumen = hhmm(hTrabajadas) + ' / ' + hhmm(hTeoricas);
    }

    // Construir ítem mes
    var mesId   = 'mes-' + m;
    var bodyId  = 'mes-body-' + m;
    var arrowId = 'mes-arrow-' + m;

    var item = document.createElement('div');
    item.className = 'mes-item';
    item.innerHTML =
      '<div class="mes-header" onclick="toggleMes(' + m + ')">' +
        '<span class="mes-nombre ' + clsMes + '">' + NOMBRES_MESES[m] + '</span>' +
        '<span class="mes-resumen">' + txtResumen + '</span>' +
        '<span class="mes-arrow" id="' + arrowId + '">▼</span>' +
      '</div>' +
      '<div class="mes-body" id="' + bodyId + '">' +
        buildCalGrid(anio, m, hoy, horasPorDia) +
      '</div>';
    container.appendChild(item);

    // Abrir mes actual por defecto
    if (mesActual) {
      document.getElementById(bodyId).classList.add('open');
      document.getElementById(arrowId).classList.add('open');
    }
  }
}

function toggleMes(m) {
  var body  = document.getElementById('mes-body-' + m);
  var arrow = document.getElementById('mes-arrow-' + m);
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

function buildCalGrid(anio, mes, hoy, horasPorDia) {
  var totalDias  = new Date(anio, mes + 1, 0).getDate();
  // Día de la semana del primer día (0=Dom → convertir a Lun=0)
  var primerDow  = new Date(anio, mes, 1).getDay();
  primerDow      = primerDow === 0 ? 6 : primerDow - 1; // lunes=0

  var hMinDia    = HORAS_ANUALES_CONVENIO / diasLaborablesAnio(anio);

  var html = '<div class="cal-week-header">' +
    DIAS_SEMANA.map(function(d){ return '<div class="cal-wd">' + d + '</div>'; }).join('') +
    '</div><div class="cal-grid">';

  // Celdas vacías iniciales
  for (var e = 0; e < primerDow; e++) {
    html += '<div class="cal-dia vacio"></div>';
  }

  for (var d = 1; d <= totalDias; d++) {
    var fecha   = new Date(anio, mes, d);
    var dow     = fecha.getDay(); // 0=Dom, 6=Sab
    var esHoy   = (fecha.toDateString() === hoy.toDateString());
    var esFuturo = fecha > hoy;
    var key     = anio + '-' + String(mes+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var horas   = horasPorDia[key] || 0;
    var esFinSemana = (dow === 0 || dow === 6);

    var cls, horasTxt;
    if (esFuturo) {
      cls      = 'futuro sin-datos';
      horasTxt = '';
    } else if (horas === 0) {
      cls      = 'sin-datos';
      horasTxt = '';
    } else if (!esFinSemana && horas >= hMinDia - 0.25) {
      cls      = 'ok';
      horasTxt = hhmm(horas);
    } else if (horas > 0) {
      cls      = 'err';
      horasTxt = hhmm(horas);
    } else {
      cls      = 'sin-datos';
      horasTxt = '';
    }
    if (esHoy) cls += ' hoy';

    html += '<div class="cal-dia ' + cls + '" title="' + key + (horas ? ' · ' + hhmm(horas) : '') + '">' +
              '<span class="dia-num">' + d + '</span>' +
              (horasTxt ? '<span class="dia-h">' + horasTxt + '</span>' : '') +
            '</div>';
  }

  html += '</div>';
  return html;
}

// ── Helper: horas decimales → "Xh Ym" ────────────────────────────────────
function hhmm(hDecimal) {
  if (hDecimal == null || isNaN(hDecimal)) return '—';
  var total = Math.round(hDecimal * 60);
  var h = Math.floor(total / 60);
  var m = total % 60;
  return m > 0 ? h + 'h ' + m + 'm' : h + 'h';
}

// ── Helpers horario departamento ─────────────────────────────────────────
// Dado un horario {horaEntrada, horaSalida, diasActivos, horasDia},
// calcula los días laborables del mes que caen en diasActivos
function diasLaborablesMesConHorario(anio, mes, diasActivos) {
  var total = new Date(anio, mes + 1, 0).getDate();
  var count = 0;
  for (var d = 1; d <= total; d++) {
    var dow = new Date(anio, mes, d).getDay();
    if (diasActivos.indexOf(dow) >= 0) count++;
  }
  return count;
}
function diasLaborablesHastaDiaConHorario(anio, mes, diaHasta, diasActivos) {
  var count = 0;
  for (var d = 1; d <= diaHasta; d++) {
    var dow = new Date(anio, mes, d).getDay();
    if (diasActivos.indexOf(dow) >= 0) count++;
  }
  return count;
}

// ── Haversine ─────────────────────────────────────────────────────────────
function haversineMetros(lat1, lng1, lat2, lng2) {
  const R  = 6371000;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lng2 - lng1) * Math.PI / 180;
  const a  = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Geolocalización ───────────────────────────────────────────────────────
function getLocation() {
  return new Promise(function(resolve, reject) {
    if (!navigator.geolocation) { reject(new Error('Geolocalización no disponible')); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      function(err) {
        if      (err.code === err.PERMISSION_DENIED)    reject(new Error('Permiso de ubicación denegado'));
        else if (err.code === err.POSITION_UNAVAILABLE) reject(new Error('Ubicación no disponible'));
        else if (err.code === err.TIMEOUT)              reject(new Error('Tiempo de espera agotado'));
        else reject(new Error('Error de geolocalización: ' + err.message));
      },
      { timeout: 10000, maximumAge: 0 }
    );
  });
}

  if (deptId) procesarFichajeAutomatico(deptId);
  else        initScanner();
})();
</script>
